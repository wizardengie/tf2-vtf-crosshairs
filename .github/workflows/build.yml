name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/TF2Crosshairs/TF2Crosshairs.csproj -c Release -nologo

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: TF2Crosshairs
          path: src/TF2Crosshairs/bin/Release/net48/TF2Crosshairs.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/TF2Crosshairs/bin/Release/net48/TF2Crosshairs.exe

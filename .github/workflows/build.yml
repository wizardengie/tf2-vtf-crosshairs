name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained and framework-dependent)
        run: .\build.ps1
        shell: pwsh

      - name: Upload exes
        uses: actions/upload-artifact@v4
        with:
          name: TF2Crosshairs
          path: |
            dist/TF2Crosshairs.exe
            dist/TF2Crosshairs-slim.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TF2Crosshairs.exe
            dist/TF2Crosshairs-slim.exe
